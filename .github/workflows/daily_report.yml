name: Daily Sports Analysis Briefing

on:
  schedule:
    # 1) MLB 아침 브리핑: 매일 06:30 KST (UTC 21:30)
    - cron: '30 21 * * *'
    # 2) KBO 오후 브리핑: 매일 15:30 KST (UTC 06:30)
    - cron: '30 6 * * *'
  
  # GitHub 웹페이지에서 언제든지 수동 실행 가능
  workflow_dispatch:
    inputs:
      sport:
        description: '분석할 종목 선택'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mlb
          - kbo
      dry_run:
        description: 'Dry Run (디스코드 전송 생략하고 로그만 확인)'
        required: false
        default: false
        type: boolean

jobs:
  run-sports-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 스포츠 분석 파이프라인 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # 수동 실행인 경우 입력값 반영, 자동 스케줄인 경우 all 실행
          SPORT_PARAM="${{ github.event.inputs.sport || 'all' }}"
          DRY_RUN_PARAM="${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}"
          
          echo "실행 파라미터: Sport=$SPORT_PARAM, DryRun=$DRY_RUN_PARAM"
          python -m src.main --sport "$SPORT_PARAM" $DRY_RUN_PARAM
