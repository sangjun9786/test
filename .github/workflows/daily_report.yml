name: Daily Sports Analysis Briefing

on:
  schedule:
    # 1) MLB 아침 브리핑: 매일 06:30 KST (UTC 21:30)
    - cron: '30 21 * * *'
    # 2) KBO 오후 브리핑: 매일 15:30 KST (UTC 06:30)
    - cron: '30 6 * * *'
  
  # GitHub 웹페이지에서 언제든지 수동 실행 가능
  workflow_dispatch:
    inputs:
      sport:
        description: '분석할 종목 선택'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mlb
          - kbo
      dry_run:
        description: 'Dry Run (디스코드 전송 생략하고 로그만 확인)'
        required: false
        default: false
        type: boolean

jobs:
  run-sports-briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 스포츠 분석 파이프라인 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          SPORT_PARAM="${{ github.event.inputs.sport }}"
          if [ -z "$SPORT_PARAM" ]; then
            SPORT_PARAM="all"
          fi
          
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          
          echo "실행 파라미터: Sport=$SPORT_PARAM, DryRun=$DRY_RUN_FLAG"
          python -m src.main --sport "$SPORT_PARAM" $DRY_RUN_FLAG

      - name: SQLite 데이터베이스 영구 저장 (Git 자동 커밋 & 푸시)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: auto-update sports analytics database [skip ci]"
            git push
            echo "SQLite 데이터베이스가 성공적으로 저장소에 업데이트되었습니다."
          else
            echo "새로 변경된 데이터가 없습니다."
          fi
